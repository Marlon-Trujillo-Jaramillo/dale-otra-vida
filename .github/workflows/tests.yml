name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.4'
      SERVERPOD_PASSWORD_database: 'bQw-1Yiy21hpwGEoZgLerW-ofFmWn7vj'
      SERVERPOD_PASSWORD_redis: '4luFLpYKYVXqsKgYI21EyZBVjMmZ3Zll'
      # Administrator email the identity tests sign in as.
      SERVERPOD_PASSWORD_identityAdmins: 'admin@test.dov'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: dale_otra_vida_server
        run: serverpod generate

      - name: Run tests
        working-directory: dale_otra_vida_server
        run: dart test

  flutter:
    name: Flutter app tests
    runs-on: ubuntu-latest
    env:
      # The app targets Medellín; date tests check the UTC -> local conversion
      # in Colombia's time zone (UTC-5). Runners default to UTC.
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        working-directory: dale_otra_vida_flutter
        run: flutter test --coverage

      - name: Coverage in the run summary
        if: always() && hashFiles('dale_otra_vida_flutter/coverage/lcov.info') != ''
        working-directory: dale_otra_vida_flutter
        run: python3 ../.github/scripts/coverage_summary.py lcov coverage/lcov.info dale_otra_vida_flutter
