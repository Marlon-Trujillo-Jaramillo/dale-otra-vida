<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dale Otra Vida: dona, intercambia, presta y vende lo que ya no usas en tu barrio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dale Otra Vida">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dale Otra Vida</title>
  <link rel="manifest" href="manifest.json">

  <!-- "Instalar app": keeps Chrome's install event so the app can offer it
       later, and tells the app which install path the browser supports. -->
  <script>
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        deferred = event;
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
      });
      function standalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
      }
      function ios() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }
      window.dovInstall = {
        // installed | prompt | ios | android | none
        state: function () {
          if (standalone()) return 'installed';
          if (ios()) return 'ios';
          if (deferred) return 'prompt';
          if (/android/i.test(navigator.userAgent)) return 'android';
          return 'none';
        },
        prompt: function () {
          if (!deferred) return Promise.resolve(false);
          var event = deferred;
          deferred = null;
          event.prompt();
          return event.userChoice.then(function (choice) {
            return choice.outcome === 'accepted';
          });
        },
        dismissed: function () {
          try { return localStorage.getItem('dovInstallDismissed') === '1'; }
          catch (e) { return false; }
        },
        dismiss: function () {
          try { localStorage.setItem('dovInstallDismissed', '1'); } catch (e) {}
        }
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
